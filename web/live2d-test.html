<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>live2d test</title>
<style>html,body{margin:0;background:#0a1018}canvas{display:block}</style>
</head><body>
<script src="/vendor/live2dcubismcore.min.js"></script>
<script src="/vendor/pixi.min.js"></script>
<script src="/vendor/cubism4.min.js"></script>
<div id="host" style="width:600px;height:700px"></div>
<script>
const log = (...a) => console.log('[l2d]', ...a);
(async () => {
  try {
    log('PIXI', typeof PIXI, '| live2d', typeof (window.PIXI && PIXI.live2d), '| core', typeof Live2DCubismCore);
    const w = 600, h = 700;
    const app = new PIXI.Application({width:w, height:h, backgroundAlpha:0, antialias:true});
    document.getElementById('host').appendChild(app.view);
    const url = '/live2d/model.model3.json';
    const model = await PIXI.live2d.Live2DModel.from(url, {autoInteract:false});
    app.stage.addChild(model);
    const s = Math.min(w/model.width, h/model.height)*1.05;
    model.scale.set(s);
    model.x = (w - model.width*s)/2;
    model.y = h - model.height*s;
    app.ticker.add(() => {
      const c = model.internalModel.coreModel;
      c.setParameterValueById('ParamMouthOpenY', 0.3 + 0.3*Math.sin(performance.now()/300));
    });
    log('MODEL OK', model.width, model.height);
    document.title = 'OK';
  } catch (e) {
    log('ERR', (e && e.message) || String(e));
    document.title = 'ERR';
  }
})();
</script>
</body></html>
